spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:oracle:thin:@ecommerce_tp?TNS_ADMIN=${WALLET_DIR:/Users/raghavendra/Downloads/Wallet_ECOMMERCE}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only maps onto it
      ddl-auto: none
    properties:
      hibernate:
        # qualify every table with the service schema instead of relying on the session's CURRENT_SCHEMA
        default_schema: CART
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: CART
    default-schema: CART

server:
  tomcat:
    mbeanregistry:
      enabled: true
  port: ${SERVER_PORT:8084}

cart:
  max-distinct-items: 50
  max-quantity-per-item: 10
  # carts untouched for this long are purged by a daily job
  ttl: 30d

# Downstream services (TDD §12.5: Cart -> Product, Supplier offers, Inventory availability)
product-service:
  base-url: ${PRODUCT_SERVICE_URL:https://product-service-1o2l.onrender.com}
  connect-timeout: 5s
  read-timeout: 30s
supplier-service:
  base-url: ${SUPPLIER_SERVICE_URL:https://supplier-service-tha0.onrender.com}
  connect-timeout: 5s
  read-timeout: 30s
inventory-service:
  base-url: ${INVENTORY_SERVICE_URL:https://inventory-manager-8q64.onrender.com}
  connect-timeout: 5s
  read-timeout: 30s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: alpha
    tryItOutEnabled: true
  show-actuator: false


management:
  otlp:
    metrics:
      export:
        enabled: true
        # Pushes the same Micrometer metrics the Prometheus endpoint serves, so Grafana Cloud needs no scraper.
        # Auth headers come from OTEL_EXPORTER_OTLP_HEADERS; only active while OTEL_METRICS_EXPORTER=otlp.
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
        base-time-unit: seconds
        resource-attributes:
          service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
    data:
      repository:
        autotime:
          enabled: true
          percentiles-histogram: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Browser origins allowed to call this API (comma separated, e.g. the test console). Empty = none.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
