spring:
  application:
    name: cart-service
  datasource:
    url: jdbc:oracle:thin:@ecommerce_tp?TNS_ADMIN=${WALLET_DIR:/Users/raghavendra/Downloads/Wallet_ECOMMERCE}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD:"@2ztrn322hyR"}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA=CART
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: CART
    default-schema: CART

server:
  port: ${SERVER_PORT:8084}

cart:
  max-distinct-items: 50
  max-quantity-per-item: 10
  # carts untouched for this long are purged by a daily job
  ttl: 30d

# Downstream services (TDD §12.5: Cart -> Product, Supplier offers, Inventory availability)
product-service:
  base-url: ${PRODUCT_SERVICE_URL:https://product-service-1o2l.onrender.com}
  connect-timeout: 5s
  read-timeout: 30s
supplier-service:
  base-url: ${SUPPLIER_SERVICE_URL:https://supplier-service-tha0.onrender.com}
  connect-timeout: 5s
  read-timeout: 30s
inventory-service:
  base-url: ${INVENTORY_SERVICE_URL:https://inventory-manager-8q64.onrender.com}
  connect-timeout: 5s
  read-timeout: 30s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: alpha
    tryItOutEnabled: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
